server:
  port: 8080

spring:
  application:
    name: tcm-pharmacy
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:tcm}
    username: ${DB_USER:tcm}
    password: ${DB_PASSWORD:tcm_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:tcm-county-pharmacy-demo-secret-key-please-change-0123456789}
    expire-hours: 12
  fees:
    decoct-per-dose: 3.00
    delivery: 6.00
    night-urgent-surcharge: 20.00
