services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcm}
      POSTGRES_USER: ${POSTGRES_USER:-tcm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcm123}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 数据库不发布到宿主端口，仅 compose 内部网络访问
    networks:
      - tcm-net

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tcm}
      DB_USER: ${POSTGRES_USER:-tcm}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-tcm123}
      JWT_SECRET: ${JWT_SECRET:-tcm-fulfillment-dev-secret-key-0123456789abcdef}
      DELIVERY_TIMEOUT_HOURS: ${DELIVERY_TIMEOUT_HOURS:-4}
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    # 后端不直接发布到宿主，由前端 nginx 反向代理 /api
    networks:
      - tcm-net

  frontend:
    build: ./frontend
    ports:
      - "${CC_PUBLISH_PORT}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tcm-net

volumes:
  pgdata:

networks:
  tcm-net:
    driver: bridge
